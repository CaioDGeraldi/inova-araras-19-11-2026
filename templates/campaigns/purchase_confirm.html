{% extends "base.html" %}

{% block content %}
<h1 class="h3">Registrar compra</h1>
<p>Cliente: <strong>{{ consumer.first_name|default:"sem nome" }}</strong></p>
<p class="text-body-secondary">Abrir esta página não registra nada. Confirme só se a venda foi concluída.</p>
<form method="post" class="col-12 col-md-6">
    {% csrf_token %}
    <label class="form-label" for="establishment">Loja</label>
    <select class="form-select" id="establishment" name="establishment">
        {% for establishment in establishments %}
            <option value="{{ establishment.pk }}">{{ establishment.name }}</option>
        {% endfor %}
    </select>
    <button class="btn btn-primary mt-3" type="submit">Confirmar venda concluída</button>
</form>
{% endblock %}
