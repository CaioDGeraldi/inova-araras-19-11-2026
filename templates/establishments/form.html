{% extends "base.html" %}

{% block content %}
<div class="auth-wrap">
    <section class="auth-card surface">
        <h1 class="h4 mb-3">{{ title }}</h1>
        <form class="vpc-form" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_div }}
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Salvar</button>
                <a class="btn btn-link" href="{% url 'panel' %}">Cancelar</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
