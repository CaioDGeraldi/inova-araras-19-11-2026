{% extends "base.html" %}

{% block content %}
<h1 class="h3">Excluir produto</h1>
<p>Excluir "{{ product.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Excluir</button>
    <a class="btn btn-link" href="{% url 'panel' %}">Cancelar</a>
</form>
{% endblock %}
