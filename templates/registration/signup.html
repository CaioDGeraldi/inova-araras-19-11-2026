{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="auth-wrap">
    <section class="auth-card surface">
        <img class="auth-icon" src="{% static 'img/marca/vem-pro-centro-icone.png' %}" alt="" width="72" height="72">
        <h1 class="h4 text-center mb-4">Criar conta</h1>
        <form class="vpc-form" method="post">
            {% csrf_token %}
            {{ form.as_div }}
            <button class="btn btn-primary w-100 mt-2" type="submit">Criar conta</button>
        </form>
        <p class="text-center mt-3 mb-0">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
    </section>
</div>
{% endblock %}
