{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="auth-wrap">
    <section class="auth-card surface">
        <img class="auth-icon" src="{% static 'img/marca/vem-pro-centro-icone.png' %}" alt="" width="72" height="72">
        <h1 class="h4 text-center mb-1">Entrar</h1>
        <p class="text-center text-body-secondary small mb-4">Acesse seus cupons, rotas e o seu QR.</p>
        <form class="vpc-form" method="post">
            {% csrf_token %}
            {{ form.as_div }}
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-primary w-100 mt-2" type="submit">Entrar</button>
        </form>
        <p class="text-center mt-3 mb-0">Ainda não tem conta? <a href="{% url 'signup' %}">Criar conta</a></p>
    </section>
</div>
{% endblock %}
