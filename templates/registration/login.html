{% extends "base.html" %}

{% block content %}
<h1 class="h3">Entrar</h1>
<form method="post" class="col-12 col-md-6">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary mt-3" type="submit">Entrar</button>
</form>
<p class="mt-3"><a href="{% url 'signup' %}">Criar conta</a></p>
{% endblock %}
