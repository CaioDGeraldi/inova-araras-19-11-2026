{% extends "base.html" %}

{% block content %}
<h1 class="page-title">Rotas de Descoberta</h1>
<p class="text-body-secondary">Percorra as paradas, faça check-in pelo QR e descubra o Centro.</p>
<div class="event-grid">
    {% for route in routes %}
        {% include "discovery_routes/_route_card.html" %}
    {% empty %}
        <p class="surface p-3 mb-0">Nenhuma rota publicada.</p>
    {% endfor %}
</div>
{% endblock %}
